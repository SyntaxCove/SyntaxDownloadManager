# Syntax Download Manager — scheduled dependency security audit (Phase 30).
#
# Weekly sweep over BOTH dependency surfaces with the full audit tooling that is
# too heavy for the per-push CI gate:
#   - npm: production dependencies (the tree that ships) must stay at zero;
#   - cargo: cargo-audit against core/Cargo.lock and the RustSec advisory DB.
#
# Findings fail the job (red badge). The per-push CI carries the cheap runtime
# npm audit gate; this workflow is the deep sweep. Manual runs: workflow_dispatch.

name: security-audit

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm (prod) + cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: npm audit (production dependencies must be at zero)
        run: npm audit --omit=dev --package-lock-only

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, stable branch snapshot 2026-10
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: cargo-audit over core/Cargo.lock
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --file core/Cargo.lock
