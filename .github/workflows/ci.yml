# Syntax Download Manager — continuous integration (Phase 26, hardened in Phase 30).
#
# Runs the same headless gate as scripts/verify-all.sh on GitHub's runners:
#   - verify:       contracts + desktop unit + E2E suites (over the REAL debug
#                   download-core binary) + fmt/clippy/cargo test + renderer
#                   build + performance budget gate + checksums/SBOM selftests
#                   + runtime dependency audit gate + the Phase 31 final QA gate
#                   (version alignment + phase-map completeness);
#   - core-windows: the Rust core must compile and pass on the shipping
#                   platform (Windows x64 MSVC), not only on the Linux sandbox.
#
# Supply-chain hardening (Phase 30): every action is pinned to a full commit SHA
# (version in the trailing comment) so a hijacked tag cannot run in our context,
# and checkouts do not persist the ephemeral github token (no job here pushes).
#
# The wire contract is frozen — CI does not mutate it; it verifies it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (ubuntu, node+rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No test launches Electron; the E2E suites supervise the real debug
      # download-core subprocess. Skipping the Electron binary keeps CI fast
      # and matches the headless verification contract.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (fmt, clippy)
        # dtolnay/rust-toolchain, stable branch snapshot 2026-10
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy

      - name: Rust cache
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: core

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build contracts (typecheck and tests consume the dist)
        run: npm run build:contracts

      - name: Typecheck (contracts, desktop main/renderer/e2e)
        run: npm run typecheck

      - name: Build the debug core binary (the E2E suites supervise it for real)
        run: cargo build --manifest-path core/Cargo.toml -p download-core

      - name: TS tests (unit + E2E over the real core)
        run: npm run test

      - name: Rust fmt check
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Renderer build
        run: npm run build:desktop

      - name: Performance budget gate (Phase 22)
        run: node scripts/check-budgets.mjs

      - name: Checksum tooling selftest (Phase 26)
        run: node scripts/checksums.mjs --selftest

      - name: SBOM generator selftest (Phase 30)
        run: node scripts/sbom.mjs --selftest

      - name: Runtime dependency audit gate (Phase 30 — shipped deps must stay at zero)
        run: npm audit --omit=dev

      - name: Final QA gate (Phase 31 — version alignment + phase map)
        run: |
          node scripts/final-qa.mjs --selftest
          node scripts/final-qa.mjs

  core-windows:
    name: core tests (windows, msvc)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, stable branch snapshot 2026-10
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Rust cache
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: core

      - name: Rust tests (windows)
        run: cargo test --manifest-path core/Cargo.toml
