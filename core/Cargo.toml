[workspace]
resolver = "2"
members = [
    "crates/dc-protocol",
    "crates/dc-storage",
    "crates/dc-bt",
    "crates/download-core",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

# Versions verified against crates.io max_stable_version on 2026-10-06 (see phase-5 report).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync", "signal", "fs", "process"] }
tokio-util = "0.7.19"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "gzip", "deflate", "brotli", "socks"] }
tracing = "0.1.44"
url = "2.5.8"
futures-util = "0.3.31"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# max stable on crates.io verified 2026-10-07 (phase-6 report)
sha2 = "0.11.0"
# BitTorrent engine (v1.8, Phase 13) — verified against crates.io max stable this session
sha1 = "0.11.0"
rand = "0.10.3"

dc-protocol = { path = "crates/dc-protocol" }
dc-storage = { path = "crates/dc-storage" }
dc-bt = { path = "crates/dc-bt" }
