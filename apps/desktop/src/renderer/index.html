<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>UniDM</title>
    <style>
      /* Bootstrap splash while the React shell loads (Phase 3 replaces this page). */
      html, body { margin: 0; height: 100%; background: #202020; color: #ffffff;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
      #boot { display: flex; height: 100%; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; }
      #boot .mark { font-size: 28px; font-weight: 600; letter-spacing: 0.5px; }
      #boot .bar { width: 160px; height: 3px; background: #454545; border-radius: 2px;
        overflow: hidden; position: relative; }
      #boot .bar::after { content: ""; position: absolute; inset: 0; width: 40%;
        background: #60cdff; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(400%);} }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="UniDM is starting">
      <div class="mark">UniDM</div>
      <div class="bar"></div>
    </div>
  </body>
</html>
